[workspace] 
members = [ 
    "contracts/smart-accounts/*",
    "packages/*",
    # "scripts", # commented out until cw@v3 support for cw-orch
    "test-suite",
    ]
exclude = ["test-suite"]

resolver = "2"

[workspace.package]
version = "0.3.0"
authors = ["Hard-nett <hardnettt@proton.me>"]
edition = "2021"
homepage   = "https://bitsong.io"
repository = "https://github.com/bitsongofficial/bs-accounts"
documentation = "https://docs.bitsong.io"
license    = "Apache-2.0"

[workspace.dependencies]
btsg-account                   = { path = "packages/btsg-account" }
btsg-auth                      = { path = "packages/btsg-auth" }
easy-addr                      = { path = "packages/easy-addr" }
btsg-irl                       = { path = "contracts/smart-accounts/btsg-irl"  }
btsg-wavs                      = { path = "contracts/smart-accounts/btsg-wavs" }
btsg-zktls                     = { path = "contracts/smart-accounts/btsg-zktls"  }
btsg-eth                       = { path = "contracts/smart-accounts/btsg-eth"  }
btsg-ed25519                   = { path = "contracts/smart-accounts/btsg-ed25519"  }
btsg-passkey                   = { path = "contracts/smart-accounts/btsg-passkey"  }



 

abstract-std      = { version = "0.26.0" }
cw-orch           = { version = "0.28.0" }

# bs721           = { git = "https://github.com/permissionlessweb/bs-nfts", branch = "feat/cosmwasm@v3",package = "bs721" }
bs721-base        = { git = "https://github.com/permissionlessweb/bs-nfts", branch = "feat/cosmwasm@v3"}
bs-controllers    = { git = "https://github.com/permissionlessweb/bs-nfts", branch = "feat/cosmwasm@v3", library = "bs-controllers" } 
btsg-nft-scripts  = { git = "https://github.com/permissionlessweb/bs-nfts", branch = "feat/cosmwasm@v3", package = "btsg-nft-scripts" }
saa               = { git = "https://github.com/permissionlessweb/smart-account-auth", branch = "mvp", package = "smart-account-auth", features = ["cosmwasm", "native", "curves", "session", "utils", "types"]}
saa-common        = { git = "https://github.com/permissionlessweb/smart-account-auth", branch = "mvp", features = [ ]}
saa-passkeys      = { git = "https://github.com/permissionlessweb/smart-account-auth", branch = "mvp", library = "passkeys", features = ["cosmwasm"] }
cosmos-sdk-proto  = { git = "https://github.com/permissionlessweb/cosmos-rust", version = "0.28.0", default-features = false }
cosmwasm-std      = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp",features = ["cosmwasm_1_4", "cosmwasm_2_0"] }
cosmwasm-schema   = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp", package = "cosmwasm-schema" }
cw2               = { git = "https://github.com/permissionlessweb/cw-minus", branch = "mvp", package = "cw2" }
cw-ownable        = { git = "https://github.com/permissionlessweb/cw-plus-plus",package = "cw-ownable" , branch = "feat/mvp" }
cw-storage-macro  = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "mvp",package = "cw-storage-macro" }
cw-storage-plus   = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "mvp" }
cosmwasm-crypto   = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp",package = "cosmwasm-crypto" }
cw-utils          = { git = "https://github.com/permissionlessweb/cw-minus", branch = "mvp", package = "cw-utils" }

bech32            = { version = "0.11.0", default-features = false, features = ["alloc"] }
ecdsa             = { version = "0.16.2" }  
k256              = { version = "0.13.3", default-features = false, features = ["ecdsa"] }
ripemd            = { version = "0.1.3",  default-features = false } 
schemars          = { version = "0.8.16" }
semver            = { version = "1.0.26" }
serde             = { version = "1.0.197", default-features = false, features = ["derive"] }
serde_json        = { version = "1.0.79" }
sha2              = { version = "0.10.8", default-features = false } 
subtle-encoding   = { version = "0.5.1", features = ["bech32-preview"] }
thiserror         = { version = "1.0.58" }
hex               = { version = "0.4.3" }
base64                  = { version = "0.22.1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true